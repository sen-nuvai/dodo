services:
  app:
    build:
      context: .
    environment:
      API_TOKEN: ${API_TOKEN:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-demo_secret}
      PORT: 3000
      RUST_LOG: ${RUST_LOG:-info}
      PSP_URL: ${PSP_URL:-http://mock-psp:4000}
      DATABASE_URL: ${DATABASE_URL:-postgres://dodo:dodo@db:5432/dodo}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mock-psp:
    build:
      context: .
    command: ["mock-psp"]
    environment:
      PORT: 4000
    ports:
      - "${PSP_PORT:-4000}:4000"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dodo
      POSTGRES_USER: dodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dodo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dodo -d dodo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
